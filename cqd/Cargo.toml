[package]
name = "cqd"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
openssl = { version = "0.10.81", features = ["vendored"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
uuid = { version = "1.29.0", features = ["v4", "fast-rng", "serde"] }
web-push = "0.11.0"
