<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CERESIT DISPATCHER // NOTHING OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #000000;
            --surface: #0e0e0e;
            --surface-elevated: #161616;
            --border-dim: #262626;
            --border-bright: #444444;
            --text-main: #f5f5f5;
            --text-muted: #888888;
            --nothing-red: #d71921;
            --font-dot: 'Doto', monospace;
            --font-body: 'Space Grotesk', -apple-system, sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-black);
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            font-family: var(--font-body);
            padding: 28px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-dim);
            padding-bottom: 20px;
            margin-bottom: 28px;
        }
        .brand {
            font-family: var(--font-dot);
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .red-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--nothing-red);
            box-shadow: 0 0 10px var(--nothing-red);
            animation: pulse-red 2s infinite;
        }
        .tag-local {
            font-family: var(--font-mono);
            background: #ffffff;
            color: #000000;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Nothing Style Metric Widgets */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }
        .metric-widget {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-dim);
            border-radius: 24px;
            padding: 22px;
            position: relative;
        }
        .metric-title {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .metric-val {
            font-family: var(--font-dot);
            font-size: 2.6rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            line-height: 1;
        }
        .metric-sub {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 24px;
        }

        /* Order Form Panel */
        .panel-widget {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-dim);
            border-radius: 28px;
            padding: 24px;
        }
        .panel-title {
            font-family: var(--font-dot);
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        input, select {
            width: 100%;
            background: #000000;
            border: 1px solid var(--border-bright);
            border-radius: 14px;
            padding: 12px 14px;
            color: #ffffff;
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus, select:focus {
            border-color: #ffffff;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-submit {
            width: 100%;
            min-height: 54px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 999px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 14px;
            transition: all 0.15s;
        }
        .btn-submit:active { transform: scale(0.98); background: #e5e5e5; }

        /* Orders Table */
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            text-align: left;
            padding: 14px 12px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-dim);
            text-transform: uppercase;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 1px;
        }
        td {
            padding: 16px 12px;
            border-bottom: 1px solid var(--border-dim);
            vertical-align: middle;
        }
        tr:hover { background: rgba(255,255,255,0.02); }

        .status-badge {
            display: inline-block;
            font-family: var(--font-mono);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--border-bright);
        }
        .status-Registered { background: transparent; color: #ffffff; }
        .status-TechCardPending { background: transparent; color: #ffffff; border-color: #888; }
        .status-Accepted { background: #ffffff; color: #000000; }
        .status-Mixing { background: #ffffff; color: #000000; }
        .status-Paused { background: rgba(215, 25, 33, 0.2); color: #ff858d; border-color: var(--nothing-red); }
        .status-Ready { background: #ffffff; color: #000000; }
        .status-Delivered { background: #1a1a1a; color: #777777; border-color: #262626; }

        /* Delay Alert Pill */
        .delay-alert-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: #ff858d;
            background: rgba(215, 25, 33, 0.15);
            border: 1px solid var(--nothing-red);
            padding: 4px 10px;
            border-radius: 999px;
            margin-top: 4px;
        }

        .link-track {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">
            <div class="red-dot"></div>
            <span>CERESIT DISPATCHER // NOTHING OS</span>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
            <span class="tag-local">LOCAL LAN</span>
            <span id="current-time" style="font-family: var(--font-dot); font-size: 1.4rem; color: #ffffff; letter-spacing: 2px;">00:00:00</span>
        </div>
    </div>

    <!-- Metrics Grid -->
    <div class="metrics-grid">
        <div class="metric-widget">
            <div class="metric-title">QUEUE ACTIVE</div>
            <div class="metric-val" id="metric-active-count">0</div>
            <div class="metric-sub" id="metric-mixing-sub">0 IN MIXER</div>
        </div>
        <div class="metric-widget">
            <div class="metric-title">TOTAL TONNAGE</div>
            <div class="metric-val" id="metric-tonnage">0 KG</div>
            <div class="metric-sub" id="metric-buckets-sub">0 BUCKETS TINTED</div>
        </div>
        <div class="metric-widget">
            <div class="metric-title">READY ON RAMP</div>
            <div class="metric-val" id="metric-ready-count">0</div>
            <div class="metric-sub">AWAITING DRIVER PICKUP</div>
        </div>
    </div>

    <div class="main-layout">
        <!-- New Order Registration -->
        <div class="panel-widget">
            <div class="panel-title">REGISTER BATCH</div>
            <form id="new-order-form" onsubmit="createOrder(event)">
                <div class="form-group">
                    <label>WAYBILL / ORDER NUMBER</label>
                    <input type="text" id="order_number" placeholder="#1042" required>
                </div>
                <div class="form-group">
                    <label>CLIENT / DRIVER NAME</label>
                    <input type="text" id="client_name" placeholder="БудСервіс (Василь)" required>
                </div>
                <div class="form-group">
                    <label>CERESIT MATERIAL</label>
                    <select id="material">
                        <option value="Ceresit CT 174 (1.5mm)">Ceresit CT 174 (1.5mm)</option>
                        <option value="Ceresit CT 174 (2.0mm)">Ceresit CT 174 (2.0mm)</option>
                        <option value="Ceresit CT 60 (1.5mm)">Ceresit CT 60 (1.5mm)</option>
                        <option value="Ceresit CT 48 (Фасадна силіконова)">Ceresit CT 48 (Силіконова)</option>
                        <option value="Ceresit CT 54 (Силікатна)">Ceresit CT 54 (Силікатна)</option>
                        <option value="Ceresit CT 74 (Силіконова 1.5mm)">Ceresit CT 74 (Силіконова 1.5mm)</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>BUCKET COUNT</label>
                        <input type="number" id="total_buckets" min="1" max="200" value="5" required>
                    </div>
                    <div class="form-group">
                        <label>WEIGHT</label>
                        <select id="bucket_weight">
                            <option value="25 кг">25 кг</option>
                            <option value="15 кг">15 кг</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>COLOR RECIPE</label>
                    <input type="text" id="color_code" placeholder="Nebraska 3 / Texas 4" required>
                </div>
                <button type="submit" class="btn-submit">DISPATCH TO WORKSHOP QUEUE</button>
            </form>

            <div id="new-order-result" style="display: none; margin-top: 20px; padding: 14px; background: #000; border: 1px solid var(--border-bright); border-radius: 16px;">
                <div style="font-family: var(--font-mono); font-size: 0.8rem; color: #ffffff; margin-bottom: 6px;">● ORDER DISPATCHED</div>
                <div style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted);">PUBLIC TRACKING URL:</div>
                <div id="track-url-display" style="font-family: var(--font-mono); font-size: 0.8rem; word-break: break-all; color: #ffffff; margin-top: 4px;"></div>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="panel-widget">
            <div class="panel-title">LIVE PRODUCTION LOG</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ORDER</th>
                            <th>CLIENT</th>
                            <th>MATERIAL</th>
                            <th>PROGRESS</th>
                            <th>STATUS</th>
                            <th>TRACK</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let orders = [];

        setInterval(() => {
            document.getElementById('current-time').innerText = new Date().toTimeString().split(' ')[0];
        }, 1000);

        async function fetchOrders() {
            try {
                const res = await fetch('/api/admin/orders');
                if (res.ok) {
                    orders = await res.json();
                    renderTable();
                    renderMetrics();
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderMetrics() {
            const active = orders.filter(o => o.status !== 'Delivered');
            const mixing = orders.filter(o => o.status === 'Mixing');
            const ready = orders.filter(o => o.status === 'Ready');

            document.getElementById('metric-active-count').innerText = active.length;
            document.getElementById('metric-mixing-sub').innerText = `${mixing.length} IN MIXER`;
            document.getElementById('metric-ready-count').innerText = ready.length;

            let totalKg = 0;
            let totalBuckets = 0;

            orders.forEach(o => {
                const weightPerBucket = o.bucket_weight.includes('15') ? 15 : 25;
                totalKg += o.buckets_completed * weightPerBucket;
                totalBuckets += o.buckets_completed;
            });

            document.getElementById('metric-tonnage').innerText = `${totalKg} KG`;
            document.getElementById('metric-buckets-sub').innerText = `${totalBuckets} BUCKETS PROCESSED`;
        }

        function renderTable() {
            const tbody = document.getElementById('orders-tbody');
            tbody.innerHTML = '';

            orders.forEach(o => {
                const tr = document.createElement('tr');

                tr.innerHTML = `
                    <td><strong style="font-family: var(--font-dot); font-size: 1.15rem; letter-spacing: 1px;">${o.order_number}</strong></td>
                    <td>${o.client_name}</td>
                    <td>
                        <div>${o.material}</div>
                        <div style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted);">${o.color_code}</div>
                    </td>
                    <td style="font-family: var(--font-mono);">${o.buckets_completed} / ${o.total_buckets}</td>
                    <td><span class="status-badge status-${o.status}">${o.status}</span></td>
                    <td>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <a href="/track/${o.token}" target="_blank" class="link-track">TRACK ↗</a>
                            <button onclick="deleteOrder('${o.id}', '${o.order_number}')" style="background: transparent; border: 1px solid rgba(215, 25, 33, 0.45); color: #d71921; font-family: var(--font-mono); font-size: 0.72rem; padding: 4px 8px; border-radius: 6px; cursor: pointer;">✕</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function createOrder(e) {
            e.preventDefault();
            const payload = {
                order_number: document.getElementById('order_number').value,
                client_name: document.getElementById('client_name').value,
                material: document.getElementById('material').value,
                total_buckets: parseInt(document.getElementById('total_buckets').value),
                bucket_weight: document.getElementById('bucket_weight').value,
                color_code: document.getElementById('color_code').value,
            };

            const res = await fetch('/api/admin/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                const data = await res.json();
                document.getElementById('new-order-result').style.display = 'block';
                const fullUrl = `https://cqd.yunexal.com/track/${data.token}`;
                document.getElementById('track-url-display').innerText = fullUrl;
                document.getElementById('new-order-form').reset();
                async function deleteOrder(id, num) {
            if (!confirm(`Видалити замовлення ${num}?`)) return;
            const res = await fetch(`/api/admin/orders/${id}`, { method: 'DELETE' });
            if (res.ok) fetchOrders();
        }

        fetchOrders();
            }
        }

        async function deleteOrder(id, num) {
            if (!confirm(`Видалити замовлення ${num}?`)) return;
            const res = await fetch(`/api/admin/orders/${id}`, { method: 'DELETE' });
            if (res.ok) fetchOrders();
        }

        fetchOrders();
        setInterval(fetchOrders, 3000);
    </script>
</body>
</html>
