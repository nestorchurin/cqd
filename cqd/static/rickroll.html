<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceresit Queue Daemon - Обмежений доступ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .banner {
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid #ef4444;
            border-radius: 12px;
            padding: 20px 28px;
            margin-bottom: 24px;
            max-width: 680px;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: #f87171; }
        p { font-size: 1.1rem; color: #9ca3af; line-height: 1.5; }
        .highlight { color: #facc15; font-weight: 600; }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 720px;
            aspect-ratio: 16/9;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 2px solid #374151;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="banner">
        <h1>[SEC] Безпека Ceresit Command</h1>
        <p>Диспетчерський дашборд та термінал колориста доступні <span class="highlight">виключно з внутрішньої локальної мережі</span>.</p>
        <p style="margin-top: 8px; font-size: 0.95rem;">Але для поціновувачів несанкціонованого сканування у нас є дещо особливе.</p>
    </div>
    <div class="video-container">
        <iframe 
            src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&mute=0&controls=1&loop=1&playlist=dQw4w9WgXcQ" 
            title="Never Gonna Give You Up" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>
</body>
</html>
